name: CD

# On every push to main (after CI passes): build and push the image to GitHub Container Registry,
# deploy it, then smoke-test the live service. Rollback = redeploy the previous image tag.
# Default target: Render (Frankfurt region; managed Postgres with pgvector + Key Value/Redis).
# Other targets (Cloud Run, Azure Container Apps, Fly.io) only change the "Deploy" step: see docs/BLUEPRINT.md.

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy (Render deploy hook pointing at the new image)
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}&imgURL=ghcr.io/${{ github.repository }}:${{ github.sha }}"
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.PUBLIC_URL }}/health"; then exit 0; fi
            sleep 10
          done
          echo "Service did not become healthy" && exit 1
