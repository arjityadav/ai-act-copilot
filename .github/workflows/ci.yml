name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Unit tests (fakes, no services)
        run: uv run pytest -q
        env:
          APP_ENV: test
          STORE: memory
          JOB_MODE: inline

  integration:
    runs-on: ubuntu-latest
    needs: test
    services:
      db:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: copilot, POSTGRES_PASSWORD: copilot, POSTGRES_DB: copilot}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U copilot" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Migrations + Postgres/Redis integration tests
        run: uv run python -m app.db && uv run pytest -q -m integration -k "not ollama"
        env:
          DATABASE_URL: postgresql://copilot:copilot@localhost:5432/copilot
          REDIS_URL: redis://localhost:6379/0

  eval-gate:
    # LLMOps: run the scenario evals against the production model on every PR that touches
    # prompts or agents. Skipped when no API key secret is configured.
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            llm:
              - 'prompts/**'
              - 'app/agents/**'
              - 'app/rag/**'
              - 'app/retrieval/**'
      - uses: astral-sh/setup-uv@v6
        if: steps.changes.outputs.llm == 'true' && env.ANTHROPIC_API_KEY != ''
      - name: Scenario evals (fails below the pass-rate threshold)
        if: steps.changes.outputs.llm == 'true' && env.ANTHROPIC_API_KEY != ''
        run: |
          uv sync --all-extras
          uv run python evals/run_evals.py --in-memory --min-pass-rate 0.8 --report evals/results/report.md
        env:
          LLM_PROVIDERS: anthropic
          STORE: memory
          JOB_MODE: inline
      - uses: marocchino/sticky-pull-request-comment@v2
        if: always() && hashFiles('evals/results/report.md') != ''
        with:
          path: evals/results/report.md

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push on PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-act-copilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
