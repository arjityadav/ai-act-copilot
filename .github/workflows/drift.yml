name: Drift check

# MLOps: weekly check whether production inputs drifted from the classifier's training data.
# Opens an issue when drift is significant, so retraining is a tracked decision.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - id: check
        run: uv run python scripts/drift_check.py --github-output
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL_READONLY }}
      - name: Open an issue on significant drift
        if: steps.check.outputs.status == 'significant'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo,
              title: "Significant input drift detected for the Annex III classifier",
              body: "PSI report: ${{ steps.check.outputs.summary }}\n\nReview recent inputs, label new data and run `make train`."});
