[project]
name = "ai-act-copilot"
version = "0.1.0"
description = "Multi-agent EU AI Act compliance copilot: RAG over the regulation, agentic risk classification, obligations and gap analysis."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "rq>=2.0",
    "ollama>=0.5",
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "langgraph>=0.6",
    "prometheus-client>=0.20",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
cloud = ["anthropic>=0.40", "openai>=1.50"]
mlops = ["mlflow>=3.1", "pandas>=2.2"]
tracing = ["langfuse>=3.0"]
rerank = ["sentence-transformers>=3.0"]
ui = ["streamlit>=1.38"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8", "locust>=2.31"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs running Postgres/Redis/Ollama (docker compose up)"]
addopts = "-m 'not integration'"
